name: deployment
on:
  pull_request:

jobs:
  set_env:
    name: set_env
    runs-on: ubuntu-latest
    steps:
      - name: do set up
        id: out
        run: |
          echo "setup done"
          sleep 2

  verify-db-migrations:
    name: verify-db-migrations (db=${{ matrix.db }})
    needs: set_env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [mysql, postgres]
    steps:
      - name: show which db
        run: |
          echo "Verifying DB migrations for ${{ matrix.db }}"
          sleep 3

  get-ecr-login-password:
    name: c... / get-ecr-login-password
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - name: fake ecr login
        run: |
          echo "retrieving ecr password..."
          sleep 2

  checks-no-checks:
    name: checks / no-checks
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "no checks"
          sleep 1

  checks-generated-code:
    name: checks / generated-code
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "generated code"
          sleep 2

  checks-lint-go:
    name: checks / lint-go
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "linting go..."
          sleep 2

  checks-lint-apispecs:
    name: checks / lint-apispecs
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "linting apispecs..."
          sleep 2

  build-build:
    name: build / build
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "building..."
          sleep 2

  checks-unit-tests:
    name: checks / unit-tests
    needs:
      - verify-db-migrations
      - checks-generated-code
    runs-on: ubuntu-latest
    steps:
      - name: run unit tests (failing intentionally)
        run: |
          echo "running unit tests..."
          sleep 3
          exit 1  # make it fail to show red

  dryrun:
    name: dryrun (run=${{ matrix.run }})
    needs:
      - checks-generated-code
      - checks-lint-go
      - build-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run: [dry-1, dry-2]
    steps:
      - name: dry run
        run: |
          echo "dry run: ${{ matrix.run }}"
          sleep 2
