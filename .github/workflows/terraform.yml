name: test1

on:
  pull_request:

###############################################################################
# Concurrency: Only one run per PR branch at a time
###############################################################################
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_env:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Setting environment variables"

  get-ecr-login-password:
    needs: set_env
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fetching ECR login password"

  unit-tests:
    needs: set_env
    runs-on: [ubuntu-latest] # ✅ Self-hosted runner for heavy tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}
    steps:
      - run: echo "Running unit tests"

  checks:
    needs: [get-ecr-login-password]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [no-checks, generated-code, lint-go, lint-apispecs]
    steps:
      - run: echo "Running check: ${{ matrix.check }}"

  build:
    needs: checks
    runs-on: [ubuntu-latest]
    steps:
      - run: echo "Building application"

  verify-db-migrations:
    needs: [set_env]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [migration-1, migration-2]
    steps:
      - run: echo "Verifying DB migration: ${{ matrix.shard }}"

  dryrun:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - run: echo "Dry run for ${{ matrix.env }}"
